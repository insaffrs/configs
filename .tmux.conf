set -g mouse on

set -g status on
set -g status-position bottom

set -g status-left ""
set -g status-right ""
set -g status-justify left

set -g status-style "bg=default"

set -g window-status-separator ""

set -g window-status-format "#[fg=#666666]#I "

setw -g window-status-current-format "#[fg=#ffffff, bold]#I "

set -g base-index 1
set -g pane-base-index 1

set -g renumber-windows on
